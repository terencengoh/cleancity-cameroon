name: CI

on:
  push:
    branches: [main]
    paths: ["mobile/**", "admin/**", "supabase/**", "logic.js", "tests/**", ".github/workflows/ci.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Demo rules (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  mobile:
    name: Mobile (typecheck + lint + doctor + export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo-doctor
      - name: Bundle Android JS (expo export)
        run: npx expo export --platform android --output-dir /tmp/expo-export
      - name: Icon / splash assets decoded
        run: test -s assets/icon.png && test -s assets/adaptive-icon.png && test -s assets/splash-icon.png && test -s assets/notification-icon.png

  admin:
    name: Admin dashboard (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  database:
    name: Database (migrations + seed + RPC/RLS tests on PGlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/db/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  functions:
    name: Edge Functions (check + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts tests/*.ts
      - run: deno lint
      - run: deno test --allow-read tests/
