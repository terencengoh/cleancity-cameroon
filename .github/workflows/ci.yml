name: CI

on:
  push:
    branches: [main]
    paths: ["mobile/**", "admin/**", "supabase/**", "logic.js", "tests/**", ".github/workflows/ci.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Demo rules (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  database:
    name: Database (migrations + seed + RPC/RLS tests on PGlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/db/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
